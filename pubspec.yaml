
name: baj_nemo
description: BAJ-NEMO — démonstration locale sans backend.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Préférences locales : identifiant mémorisé
  shared_preferences: ^2.5.5

  # Stockage sécurisé pour les informations de reconnexion
  flutter_secure_storage: ^9.2.4

  # Authentification biométrique et verrouillage de l'appareil
  local_auth: ^2.3.0

  # Liens externes
  url_launcher: ^6.3.1

  # Dates et formats
  intl: ^0.19.0

  # Cartes et géolocalisation
  google_maps_flutter: ^2.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
