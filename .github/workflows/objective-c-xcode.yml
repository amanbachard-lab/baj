
name: BAJ-NEMO - Build Android et iOS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK et AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.1"
          channel: stable
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Construire APK Android
        run: flutter build apk --release

      - name: Construire Android App Bundle
        run: flutter build appbundle --release

      - name: Publier les artefacts Android
        uses: actions/upload-artifact@v4
        with:
          name: BAJ-NEMO-Android
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

  ios:
    name: Build iOS
    runs-on: macos-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Diagnostic du projet iOS
        shell: bash
        run: |
          echo "=== RACINE DU DEPOT ==="
          pwd
          git rev-parse --show-toplevel

          echo "=== COMMIT ==="
          git rev-parse HEAD

          echo "=== FICHIERS XCODE SUIVIS PAR GIT ==="
          git ls-files ios/Runner.xcodeproj

          echo "=== FICHIERS XCODE SUR LE COMMIT ==="
          git ls-tree -r --name-only HEAD ios/Runner.xcodeproj

          echo "=== DOSSIER IOS ==="
          ls -la ios

          echo "=== DOSSIER RUNNER.XCODEPROJ ==="
          ls -la ios/Runner.xcodeproj || true

          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            echo "::error::Le fichier ios/Runner.xcodeproj/project.pbxproj est absent."
            exit 1
          fi

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.1"
          channel: stable
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Vérifier la configuration Flutter iOS
        run: flutter doctor -v

      - name: Construire iOS sans signature
        run: flutter build ios --release --no-codesign

      - name: Publier les artefacts iOS
        uses: actions/upload-artifact@v4
        with:
          name: BAJ-NEMO-iOS
          path: |
            build/ios/iphoneos/*.app
            build/ios/**/*.dSYM
          if-no-files-found: warn
          retention-days: 7
